<html lang="en">
<head>

  <title>My Travel History</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f1923;
      color: #e0e6f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #162030;
      border-bottom: 1px solid #2a3a50;
      flex-shrink: 0;
      flex-wrap: wrap;
      z-index: 1000;
    }

    #topbar h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #7ec8e3;
      white-space: nowrap;
      margin-right: 6px;
    }

    /* search wrapper */
    #search-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 420px;
    }

    #search-input {
      width: 100%;
      padding: 7px 36px 7px 12px;
      border-radius: 20px;
      border: 1px solid #2a3a50;
      background: #0f1923;
      color: #e0e6f0;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }
    #search-input:focus { border-color: #7ec8e3; }

    #search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #7ec8e3;
      pointer-events: none;
      font-size: 0.85rem;
    }

    #autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #162030;
      border: 1px solid #2a3a50;
      border-radius: 8px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 9999;
      box-shadow: 0 6px 24px rgba(0,0,0,.5);
    }
    #autocomplete-list div {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #autocomplete-list div:hover,
    #autocomplete-list div.active { background: #1e3248; }
    #autocomplete-list div .tag {
      font-size: 0.72rem;
      background: #2a3a50;
      border-radius: 4px;
      padding: 1px 5px;
      color: #7ec8e3;
    }
    #autocomplete-list div .visited-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }

    /* buttons */
    .btn {
      padding: 7px 13px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      transition: filter 0.15s, transform 0.1s;
    }
    .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-green  { background: #22c55e; color: #fff; }
    .btn-blue   { background: #3b82f6; color: #fff; }
    .btn-yellow { background: #f59e0b; color: #fff; }
    .btn-red    { background: #ef4444; color: #fff; }
    .btn-teal   { background: #0d9488; color: #fff; }

    /* stats badge */
    #stats {
      display: flex;
      gap: 10px;
      font-size: 0.82rem;
      color: #a0b4c8;
      white-space: nowrap;
    }
    #stats span strong { color: #7ec8e3; }

    /* ── MAP ── */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* Leaflet popup style */
    .leaflet-popup-content-wrapper {
      background: #162030;
      color: #e0e6f0;
      border: 1px solid #2a3a50;
      border-radius: 10px;
    }
    .leaflet-popup-tip { background: #162030; }
    .popup-title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .popup-btn {
      display: inline-block;
      margin-top: 6px;
      margin-right: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .popup-btn-add    { background: #22c55e; color: #fff; }
    .popup-btn-remove { background: #ef4444; color: #fff; }

    /* ── LEGEND ── */
    #legend {
      position: absolute;
      bottom: 26px;
      left: 12px;
      background: rgba(22,32,48,.92);
      border: 1px solid #2a3a50;
      border-radius: 10px;
      padding: 10px 14px;
      z-index: 800;
      font-size: 0.8rem;
      line-height: 1.8;
    }
    #legend .row { display: flex; align-items: center; gap: 8px; }
    #legend .swatch {
      width: 14px; height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── SIDE PANEL ── */
    #panel {
      position: absolute;
      top: 56px;
      right: 0;
      width: 280px;
      bottom: 0;
      background: rgba(15,25,35,.96);
      border-left: 1px solid #2a3a50;
      z-index: 800;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    #panel.open { transform: translateX(0); }
    #panel-toggle {
      position: absolute;
      top: 66px;
      right: 0;
      z-index: 810;
      background: #162030;
      border: 1px solid #2a3a50;
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 8px 6px;
      cursor: pointer;
      color: #7ec8e3;
      font-size: 1rem;
      writing-mode: vertical-lr;
      transition: background 0.2s;
    }
    #panel-toggle:hover { background: #1e3248; }

    #panel h2 {
      padding: 12px 14px 8px;
      font-size: 0.95rem;
      color: #7ec8e3;
      border-bottom: 1px solid #2a3a50;
    }

    #panel-list {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }
    #panel-list .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      font-size: 0.83rem;
      border-bottom: 1px solid #1e2e3e;
    }
    #panel-list .item:last-child { border-bottom: none; }
    #panel-list .item .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #panel-list .item .name { flex: 1; }
    #panel-list .item .type-badge {
      font-size: 0.68rem;
      background: #2a3a50;
      border-radius: 4px;
      padding: 1px 5px;
      color: #7ec8e3;
    }
    #panel-list .item .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 4px;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f1923; }
    ::-webkit-scrollbar-thumb { background: #2a3a50; border-radius: 3px; }

    /* toast */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #22c55e;
      color: #fff;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 9999;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* hidden file input */
    #file-import { display: none; }

    /* export overlay */
    #export-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 9998;
      align-items: center;
      justify-content: center;
    }
    #export-overlay.show { display: flex; }
    #export-box {
      background: #162030;
      border: 1px solid #2a3a50;
      border-radius: 14px;
      padding: 20px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    #export-box h3 { color: #7ec8e3; margin-bottom: 10px; }
    #export-box p { font-size: 0.85rem; color: #a0b4c8; margin-bottom: 16px; }
    #export-preview {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 14px;
      display: none;
    }
    .export-btns { display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>✈️ Travel History</h1>

  <div id="search-wrapper">
    <input id="search-input" type="text" placeholder="Search country or city…" autocomplete="off" />
    <span id="search-icon">🔍</span>
    <div id="autocomplete-list" style="display:none;"></div>
  </div>

  <div id="stats">
    <span>🌍 <strong id="stat-countries">0</strong> countries</span>
    <span>🏙️ <strong id="stat-cities">0</strong> cities</span>
  </div>

  <button class="btn btn-yellow" onclick="exportJSON()">⬇ Export JSON</button>
  <button class="btn btn-blue" onclick="document.getElementById('file-import').click()">⬆ Import JSON</button>
  <button class="btn btn-teal" onclick="openExportPNG()">🖼 Export PNG</button>
  <button class="btn btn-red" onclick="clearAll()">🗑 Clear All</button>
  <input type="file" id="file-import" accept=".json" onchange="importJSON(event)" />
</div>

<!-- MAP -->
<div id="map"></div>

<!-- SIDE PANEL TOGGLE -->
<button id="panel-toggle" onclick="togglePanel()" title="Toggle visited list">📋 Visited</button>

<!-- SIDE PANEL -->
<div id="panel">
  <h2>Visited Places</h2>
  <div id="panel-list"></div>
</div>

<!-- LEGEND -->
<div id="legend">
  <div class="row"><div class="swatch" style="background:#3b82f6;"></div> Visited Country</div>
  <div class="row"><div class="swatch" style="background:#f59e0b;border-radius:50%;"></div> Visited City</div>
  <div class="row"><div class="swatch" style="background:#1e3248;"></div> Unvisited</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- EXPORT OVERLAY -->
<div id="export-overlay">
  <div id="export-box">
    <h3>Export Map as PNG</h3>
    <p>Capture the current map view as a PNG image you can use as a wallpaper.</p>
    <img id="export-preview" alt="Map preview" />
    <div class="export-btns">
      <button class="btn btn-teal" id="capture-btn" onclick="captureMap()">📸 Capture</button>
      <button class="btn btn-green" id="download-btn" onclick="downloadPNG()" style="display:none;">💾 Download</button>
      <button class="btn btn-red" onclick="closeExport()">✕ Close</button>
    </div>
  </div>
</div>

/* =====================================================================
   MAP SETUP
   ===================================================================== */

const map = L.map('map', {
  center: [20, 10],
  zoom: 2,
  minZoom: 2,
  maxZoom: 12,
  zoomControl: true,
});

// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CartoDB</a> | &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

/* =====================================================================
   COUNTRY GEOJSON LAYER
   ===================================================================== */

let geoLayer = null;
const GEOJSON_URL = 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';

function countryStyle(feature) {
  const name = feature.properties.ADMIN;
  const visited = visitedCountries.has(name);
  return {
    fillColor: visited ? '#3b82f6' : '#1e3248',
    fillOpacity: visited ? 0.65 : 0.35,
    color: visited ? '#7ec8e3' : '#2a3a50',
    weight: visited ? 1.5 : 0.5,
  };
}

function onEachCountry(feature, layer) {
  const name = feature.properties.ADMIN;
  layer.on({
    mouseover(e) {
      if (!visitedCountries.has(name)) {
        e.target.setStyle({ fillOpacity: 0.55, fillColor: '#254d75' });
      }
    },
    mouseout(e) {
      geoLayer.resetStyle(e.target);
    },
    click(e) {
      const visited = visitedCountries.has(name);
      const html = `
        <div class="popup-title">🌍 ${name}</div>
        ${visited
          ? `<button class="popup-btn popup-btn-remove" onclick="removeCountry('${name.replace(/'/g,"\\'")}')">✕ Remove</button>`
          : `<button class="popup-btn popup-btn-add" onclick="addCountry('${name.replace(/'/g,"\\'")}')">✓ Mark as visited</button>`}
      `;
      L.popup().setLatLng(e.latlng).setContent(html).openOn(map);
    },
  });
}

fetch(GEOJSON_URL)
  .then(r => r.json())
  .then(data => {
    geoLayer = L.geoJSON(data, {
      style: countryStyle,
      onEachFeature: onEachCountry,
    }).addTo(map);
  })
  .catch(() => showToast('⚠️ Could not load country borders', '#ef4444'));

/* =====================================================================
   CITY MARKERS
   ===================================================================== */

const cityMarkers = new Map(); // key → Leaflet marker

function createCityIcon(visited) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${visited?12:7}px;height:${visited?12:7}px;
      background:${visited?'#f59e0b':'#2a3a50'};
      border:${visited?'2px solid #fff':'1px solid #3a4a5a'};
      border-radius:50%;
      box-shadow:${visited?'0 0 8px rgba(245,158,11,.8)':'none'};
      transition:all .2s;
    "></div>`,
    iconSize: [visited?12:7, visited?12:7],
    iconAnchor: [visited?6:3.5, visited?6:3.5],
  });
}

function renderCityMarkers() {
  // remove existing
  cityMarkers.forEach(m => map.removeLayer(m));
  cityMarkers.clear();

  CITIES.forEach(city => {
    const key = cityKey(city);
    const visited = visitedCities.has(key);
    const marker = L.marker([city.lat, city.lng], {
      icon: createCityIcon(visited),
      title: city.name,
    });

    marker.on('click', () => {
      const v = visitedCities.has(key);
      const html = `
        <div class="popup-title">🏙️ ${city.name}</div>
        <div style="font-size:.8rem;color:#a0b4c8;margin-bottom:4px;">${city.country}</div>
        ${v
          ? `<button class="popup-btn popup-btn-remove" onclick="removeCityByKey('${key.replace(/'/g,"\\'")}')">✕ Remove</button>`
          : `<button class="popup-btn popup-btn-add" onclick="addCityByKey('${key.replace(/'/g,"\\'")}')">✓ Mark as visited</button>`}
      `;
      L.popup().setLatLng([city.lat, city.lng]).setContent(html).openOn(map);
    });

    marker.addTo(map);
    cityMarkers.set(key, marker);
  });
}

function cityKey(city) { return `${city.name}, ${city.country}`; }

/* =====================================================================
   ADD / REMOVE
   ===================================================================== */

function addCountry(name) {
  visitedCountries.add(name);
  map.closePopup();
  refreshMap();
  saveStorage();
  updateStats();
  renderPanel();
  showToast(`✈️ ${name} added!`);
}
function removeCountry(name) {
  visitedCountries.delete(name);
  map.closePopup();
  refreshMap();
  saveStorage();
  updateStats();
  renderPanel();
  showToast(`🗑 ${name} removed`, '#ef4444');
}
function addCityByKey(key) {
  const city = CITIES.find(c => cityKey(c) === key);
  if (!city) return;
  visitedCities.set(key, city);
  map.closePopup();
  refreshMap();
  saveStorage();
  updateStats();
  renderPanel();
  showToast(`✈️ ${city.name} added!`);
}
function removeCityByKey(key) {
  visitedCities.delete(key);
  map.closePopup();
  refreshMap();
  saveStorage();
  updateStats();
  renderPanel();
  showToast(`🗑 Removed`, '#ef4444');
}

function refreshMap() {
  if (geoLayer) geoLayer.setStyle(countryStyle);
  renderCityMarkers();
}

/* =====================================================================
   STATS
   ===================================================================== */

function updateStats() {
  document.getElementById('stat-countries').textContent = visitedCountries.size;
  document.getElementById('stat-cities').textContent    = visitedCities.size;
}

/* =====================================================================
   SEARCH / AUTOCOMPLETE
   ===================================================================== */

const searchInput = document.getElementById('search-input');
const acList      = document.getElementById('autocomplete-list');
let acIndex = -1;

function buildSearchData() {
  const items = [];
  CITIES.forEach(c => items.push({ label: `${c.name}, ${c.country}`, type: 'city', data: c }));
  return items;
}
const SEARCH_DATA = buildSearchData();

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  acIndex = -1;
  if (!q) { hideAC(); return; }

  const matches = SEARCH_DATA.filter(item =>
    item.label.toLowerCase().includes(q)
  ).slice(0, 12);

  if (!matches.length) { hideAC(); return; }

  acList.innerHTML = '';
  matches.forEach((item, i) => {
    const div = document.createElement('div');
    const visited = visitedCities.has(cityKey(item.data)) || visitedCountries.has(item.data.country);
    div.innerHTML = `
      ${visited ? '<div class="visited-dot"></div>' : ''}
      <span>${item.label}</span>
      <span class="tag">${item.type}</span>
    `;
    div.addEventListener('click', () => selectSearchItem(item));
    acList.appendChild(div);
  });
  acList.style.display = 'block';
});

searchInput.addEventListener('keydown', e => {
  const divs = acList.querySelectorAll('div');
  if (e.key === 'ArrowDown') { acIndex = Math.min(acIndex+1, divs.length-1); highlight(divs); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acIndex = Math.max(acIndex-1, 0); highlight(divs); e.preventDefault(); }
  else if (e.key === 'Enter' && acIndex >= 0) { divs[acIndex].click(); }
  else if (e.key === 'Escape') hideAC();
});

function highlight(divs) {
  divs.forEach((d,i) => d.classList.toggle('active', i === acIndex));
}

document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrapper')) hideAC();
});

function hideAC() { acList.style.display = 'none'; acList.innerHTML = ''; }

function selectSearchItem(item) {
  hideAC();
  searchInput.value = '';
  if (item.type === 'city') {
    const c = item.data;
    map.setView([c.lat, c.lng], 8, { animate: true });
    const key = cityKey(c);
    const visited = visitedCities.has(key);
    const html = `
      <div class="popup-title">🏙️ ${c.name}</div>
      <div style="font-size:.8rem;color:#a0b4c8;margin-bottom:4px;">${c.country}</div>
      ${visited
        ? `<button class="popup-btn popup-btn-remove" onclick="removeCityByKey('${key.replace(/'/g,"\\'")}')">✕ Remove</button>`
        : `<button class="popup-btn popup-btn-add" onclick="addCityByKey('${key.replace(/'/g,"\\'")}')">✓ Mark as visited</button>`}
    `;
    setTimeout(() => L.popup().setLatLng([c.lat, c.lng]).setContent(html).openOn(map), 400);
  }
}

/* =====================================================================
   SIDE PANEL
   ===================================================================== */

let panelOpen = false;
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('open', panelOpen);
  document.getElementById('panel-toggle').textContent = panelOpen ? '✕ Close' : '📋 Visited';
}

function renderPanel() {
  const list = document.getElementById('panel-list');
  list.innerHTML = '';

  // countries
  [...visitedCountries].sort().forEach(name => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="dot" style="background:#3b82f6;"></div>
      <span class="name">${name}</span>
      <span class="type-badge">country</span>
      <button class="remove-btn" onclick="removeCountry('${name.replace(/'/g,"\\'")}')">✕</button>
    `;
    list.appendChild(div);
  });

  // cities
  [...visitedCities.keys()].sort().forEach(key => {
    const city = visitedCities.get(key);
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="dot" style="background:#f59e0b;"></div>
      <span class="name">${city.name}</span>
      <span class="type-badge">city</span>
      <button class="remove-btn" onclick="removeCityByKey('${key.replace(/'/g,"\\'")}')">✕</button>
    `;
    list.appendChild(div);
  });

  if (!list.children.length) {
    list.innerHTML = '<div style="padding:14px;color:#a0b4c8;font-size:.82rem;">No visited places yet. Click on the map or search!</div>';
  }
}

/* =====================================================================
   LOCAL STORAGE
   ===================================================================== */

function saveStorage() {
  localStorage.setItem('travel_countries', JSON.stringify([...visitedCountries]));
  localStorage.setItem('travel_cities',    JSON.stringify([...visitedCities.entries()]));
}

function loadStorage() {
  try {
    const c = localStorage.getItem('travel_countries');
    const ci = localStorage.getItem('travel_cities');
    if (c)  visitedCountries = new Set(JSON.parse(c));
    if (ci) visitedCities    = new Map(JSON.parse(ci));
  } catch(e) {}
}

/* =====================================================================
   IMPORT / EXPORT JSON
   ===================================================================== */

function exportJSON() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    countries: [...visitedCountries],
    cities: [...visitedCities.values()],
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `travel-history-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📦 JSON exported!');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.countries) data.countries.forEach(c => visitedCountries.add(c));
      if (data.cities)    data.cities.forEach(c    => visitedCities.set(cityKey(c), c));
      refreshMap();
      saveStorage();
      updateStats();
      renderPanel();
      showToast(`✅ Imported ${data.countries?.length||0} countries & ${data.cities?.length||0} cities`);
    } catch(err) {
      showToast('❌ Invalid JSON file', '#ef4444');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* =====================================================================
   EXPORT PNG
   ===================================================================== */

let capturedDataURL = null;

function openExportPNG() {
  capturedDataURL = null;
  document.getElementById('export-preview').style.display = 'none';
  document.getElementById('download-btn').style.display   = 'none';
  document.getElementById('capture-btn').style.display    = '';
  document.getElementById('export-overlay').classList.add('show');
}

function closeExport() {
  document.getElementById('export-overlay').classList.remove('show');
}

function captureMap() {
  showToast('📸 Capturing…', '#3b82f6');
  const mapEl = document.getElementById('map');
  html2canvas(mapEl, {
    useCORS: true,
    allowTaint: true,
    scale: window.devicePixelRatio || 1,
    logging: false,
  }).then(canvas => {
    capturedDataURL = canvas.toDataURL('image/png');
    const preview   = document.getElementById('export-preview');
    preview.src      = capturedDataURL;
    preview.style.display = 'block';
    document.getElementById('download-btn').style.display = '';
    document.getElementById('capture-btn').style.display  = 'none';
    showToast('✅ Ready to download!');
  }).catch(() => {
    showToast('❌ Capture failed. Try scrolling the map first.', '#ef4444');
  });
}

function downloadPNG() {
  if (!capturedDataURL) return;
  const a = document.createElement('a');
  a.href = capturedDataURL;
  a.download = `travel-map-${new Date().toISOString().slice(0,10)}.png`;
  a.click();
  showToast('💾 PNG downloaded!');
}

/* =====================================================================
   CLEAR ALL
   ===================================================================== */

function clearAll() {
  if (!confirm('Remove all visited countries and cities?')) return;
  visitedCountries.clear();
  visitedCities.clear();
  refreshMap();
  saveStorage();
  updateStats();
  renderPanel();
  showToast('🗑 All cleared', '#ef4444');
}

/* =====================================================================
   TOAST
   ===================================================================== */

let toastTimer = null;
function showToast(msg, color = '#22c55e') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* =====================================================================
   INIT
   ===================================================================== */

loadStorage();
renderCityMarkers();
updateStats();
renderPanel();
</script>
